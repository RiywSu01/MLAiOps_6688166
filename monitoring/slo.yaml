# Lab 4 — service level objectives.
#
# Most students write a target and stop. The third field is where the thinking is: an SLO
# without a stated response to exhaustion is a wish, not an objective.

service: itcs355-predict

objectives:
  - name: availability
    target: 0.995              # TODO(Lab 4): your number, and defend it
    window: 30d
    measurement: "successful responses / total responses, excluding 4xx"
    on_budget_exhausted: |
      Freeze new production deployments.

  - name: latency
    target_p95_ms: 250         # TODO(Lab 4): must match the target you set in loadtest/k6.js
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    on_budget_exhausted: |
      Temporarily throttle batch inference requests that larger than 50 rows.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    on_budget_exhausted: |
      Trigger the automated training pipeline on the lastest sensor window, 
      and send a notification (like email) alert to the MLOps team if automated 
      retraining fails or have problems more than 24 hours.
